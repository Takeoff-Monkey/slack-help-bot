AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  arazoza-formatter tool as a synchronous (request/response) Lambda for the Takeoff Monkey
  Slack bot. Reads an Arazoza takeoff worksheet (.xlsx/.xlsm) from the scratch S3 bucket,
  reshapes it into the standard worksheet layout with openpyxl, writes the formatted copy
  back to S3, returns a JSON result. No other AWS services are used. Claude (via
  ANTHROPIC_API_KEY) spell-checks the botanical names; blank skips that step.

Parameters:
  ScratchBucket:
    Type: String
    Description: S3 bucket the bot stages inputs to and reads outputs from.
  AnthropicApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Claude spell-checks botanical (Latin) names with this (latin.py). Blank skips that step; the summary says so.
  LatinModel:
    Type: String
    Default: "claude-haiku-5-5"
    Description: Claude model for the Latin-name spell check (latin.py LATIN_MODEL).

Globals:
  Function:
    Timeout: 120
    MemorySize: 1024

Resources:
  ArazozaFormatterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tm-tool-arazoza-formatter
      PackageType: Image
      Architectures: [x86_64]
      Environment:
        Variables:
          SCRATCH_S3_BUCKET: !Ref ScratchBucket
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          LATIN_MODEL: !Ref LatinModel
      Policies:
        # Scratch bucket only (least privilege) — read inputs, write outputs.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${ScratchBucket}/*"
    Metadata:
      Dockerfile: lambda/Dockerfile
      DockerContext: ..          # the tool dir (so formatter.py + takeoff-groupings.txt are in scope)
      DockerTag: latest

Outputs:
  FunctionName:
    Value: !Ref ArazozaFormatterFunction
    Description: Set this as the bot's tool.json entrypoint.lambda.function_name (already tm-tool-arazoza-formatter).
