AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  run_code sandbox Lambda for the Takeoff Monkey Slack bot. Executes model-written Python in
  an isolated, least-privilege function (scratch bucket only; no Textract or other AWS).
  Model code runs as a scrubbed subprocess so it can't even see the role credentials.
  Deploy with no network egress for full isolation (see the commented VpcConfig below).

Parameters:
  ScratchBucket:
    Type: String
    Description: S3 bucket the bot stages inputs to and reads outputs from.
  SandboxTimeoutSeconds:
    Type: Number
    Default: 120
    Description: Hard wall-clock cap on a single run_code execution.

Globals:
  Function:
    Timeout: 130          # a little above the in-code subprocess timeout
    MemorySize: 2048

Resources:
  SandboxFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: tm-sandbox-runcode
      PackageType: Image
      Architectures: [x86_64]
      Environment:
        Variables:
          SCRATCH_S3_BUCKET: !Ref ScratchBucket
          SANDBOX_TIMEOUT_SECONDS: !Ref SandboxTimeoutSeconds
      Policies:
        # Scratch bucket ONLY. Deliberately no Textract / no other services.
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
              Resource: !Sub "arn:aws:s3:::${ScratchBucket}/*"
      # For true no-egress isolation, place the function in a private subnet with NO NAT
      # gateway and a security group that allows no outbound traffic, e.g.:
      # VpcConfig:
      #   SubnetIds: [subnet-private-xxxx]
      #   SecurityGroupIds: [sg-no-egress-xxxx]
    Metadata:
      Dockerfile: lambda/Dockerfile
      DockerContext: ..          # the sandbox dir (so requirements.txt is in scope)
      DockerTag: latest

Outputs:
  FunctionName:
    Value: !Ref SandboxFunction
    Description: Set as the bot's SANDBOX_LAMBDA_NAME (default tm-sandbox-runcode already matches).
